; PlatformIO Project Configuration File
; Smart Grinder Controller - Mazzer Mini D
; Target: ESP32-C3 Super Mini
;
; No physical input: buttons/encoder were dropped by choice in favor of
; full control from a companion Android app over BLE. Physical
; peripherals: HX711 (load cell), the motor relay, and an optional
; read-only SSD1306 I2C OLED status screen (SDA=GPIO10, SCL=GPIO8).

[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed = 921600

; Only src/ files for the real grinder firmware - keeps display_test.cpp
; (used to swap-test the LCD module, see [env:display_test] below) and
; ssr_test.cpp (see [env:ssr_test] below) from being compiled in here and
; clashing with main.cpp's setup()/loop().
build_src_filter = +<*> -<display_test.cpp> -<i2c_display_test.cpp> -<ssr_test.cpp>

; Forces src/build_stamp.cpp to recompile every build (OLED splash build time).
extra_scripts = pre:scripts/build_stamp.py

; Libraries
; HX711 driven by our own bit-bang implementation (src/hx711.cpp), no external ADC lib needed.
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    olikraus/U8g2@^2.35.9

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ESP32-C3 has native USB, not a UART-to-USB bridge - without this,
    ; Serial.print() goes to UART0 (GPIO20/21) instead of the USB port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Standalone bare-metal LCD swap-test - zero application code, just drives
; the ST7789 module directly to settle whether the physical panel is DOA.
; Wiring/pin map from the original investigation (docs/DEVELOPMENT-LOG.md):
; SCLK=8, MOSI=10, DC=21, RST=20, no CS pin on this module, BLK tied to 3V3.
; Flash with: pio run -e display_test -t upload
; Then flash the real firmware back with: pio run -e esp32-c3-devkitc-02 -t upload
[env:display_test]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_src_filter = -<*> +<display_test.cpp>

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Standalone I2C display test for a 4-pin (GND/VCC/SCL/SDA) module -
; scans the bus, then if an OLED answers at 0x3C/0x3D draws a label with
; the SSD1306 and SH1106 drivers in turn (the two common, look-alike
; controllers). Reuses the ST7789 test's jumper wires: SCL=GPIO8,
; SDA=GPIO10.
; Flash with: pio run -e i2c_display_test -t upload
; Then flash the real firmware back with: pio run -e esp32-c3-devkitc-02 -t upload
[env:i2c_display_test]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_src_filter = -<*> +<i2c_display_test.cpp>

lib_deps =
    olikraus/U8g2@^2.35.9

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Standalone SSR output test - toggles PIN_MOTOR_SSR (GPIO2) via Serial
; commands ('o'/'f') so the switching action can be checked with a
; multimeter across the SSR's load terminals before wiring in mains/motor.
; Flash with: pio run -e ssr_test -t upload
; Then flash the real firmware back with: pio run -e esp32-c3-devkitc-02 -t upload
[env:ssr_test]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_src_filter = -<*> +<ssr_test.cpp>

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
