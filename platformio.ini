; PlatformIO Project Configuration File
; Smart Grinder Controller - Mazzer Mini D
; Target: ESP32-C3 Super Mini
;
; No physical UI: the LCD turned out to be DOA after exhaustive hardware
; testing (see docs/DEVELOPMENT-LOG.md), and buttons/encoder were dropped
; by choice in favor of full control from a companion Android app over
; BLE. Only HX711 (load cell) and the SSR motor relay remain as physical
; peripherals.

[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed = 921600

; Only src/ files for the real grinder firmware - keeps display_test.cpp
; (used to swap-test the LCD module, see [env:display_test] below) from
; being compiled in here and clashing with main.cpp's setup()/loop().
build_src_filter = +<*> -<display_test.cpp>

; Libraries
; HX711 driven by our own bit-bang implementation (src/hx711.cpp), no external ADC lib needed.
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ESP32-C3 has native USB, not a UART-to-USB bridge - without this,
    ; Serial.print() goes to UART0 (GPIO20/21) instead of the USB port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Standalone bare-metal LCD swap-test - zero application code, just drives
; the ST7789 module directly to settle whether the physical panel is DOA.
; Wiring/pin map from the original investigation (docs/DEVELOPMENT-LOG.md):
; SCLK=8, MOSI=10, DC=21, RST=20, no CS pin on this module, BLK tied to 3V3.
; Flash with: pio run -e display_test -t upload
; Then flash the real firmware back with: pio run -e esp32-c3-devkitc-02 -t upload
[env:display_test]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_src_filter = -<*> +<display_test.cpp>

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
