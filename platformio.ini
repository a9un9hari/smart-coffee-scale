; PlatformIO Project Configuration File
; Smart Grinder Controller - Mazzer Mini D
; Target: ESP32-C3 Super Mini

[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed = 921600

; Libraries
; HX711 driven by our own bit-bang implementation (src/hx711.cpp), no external ADC lib needed.
lib_deps =
    bodmer/TFT_eSPI@^2.5.43   ; Phase 2 - ST7789 display

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; TFT_eSPI setup via build flags (avoids editing the library's User_Setup.h)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=21
    -DTFT_RST=-1
    -DSPI_FREQUENCY=27000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
