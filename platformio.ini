; PlatformIO Project Configuration File
; Smart Grinder Controller - Mazzer Mini D
; Target: ESP32-C3 Super Mini

[env:esp32-c3-devkitc-02]
; Pinned to 6.5.0 (Arduino core 2.0.14) during ST7789/TFT_eSPI bring-up
; (that combo had a hardware-confirmed SPI register bug on ESP32-C3). Now
; that the display is OLED/I2C (Adafruit_SSD1306, no TFT_eSPI at all), this
; pin is no longer strictly required - kept anyway since it's the combo
; that's actually been verified stable on this board. Safe to try bumping
; back to a newer espressif32 release if that's ever worth revisiting.
platform = espressif32@6.5.0
board = esp32-c3-devkitc-02
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed = 921600

; Libraries
; HX711 driven by our own bit-bang implementation (src/hx711.cpp), no external ADC lib needed.
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ESP32-C3 has native USB, not a UART-to-USB bridge - without this,
    ; Serial.print() goes to UART0 (GPIO20/21) instead of the USB port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
