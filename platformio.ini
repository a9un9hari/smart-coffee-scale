; PlatformIO Project Configuration File
; Smart Grinder Controller - Mazzer Mini D
; Target: ESP32-C3 Super Mini

[env:esp32-c3-devkitc-02]
; TFT_eSPI@2.5.43 on ESP32-C3 caused two rounds of hardware failures:
; first a Store access fault crash (fixed by pinning platform to 6.5.0),
; then - even after that fix, and with all wiring confirmed correct with a
; multimeter (SCK/MOSI/DC all toggling as commanded at the display end) -
; a completely blank screen with no error. Root-caused to how the library
; pokes SPI hardware registers directly rather than going through the
; portable Arduino SPI class. Switched to Adafruit_ST7789 (built on
; Adafruit_SPITFT / the standard SPI class) instead, so the platform pin
; is no longer needed for a display-driver bug - kept only if something
; else still depends on it.
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed = 921600

; Libraries
; HX711 driven by our own bit-bang implementation (src/hx711.cpp), no external ADC lib needed.
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ESP32-C3 has native USB, not a UART-to-USB bridge - without this,
    ; Serial.print() goes to UART0 (GPIO20/21) instead of the USB port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
