; PlatformIO Project Configuration File
; Smart Grinder Controller - Mazzer Mini D
; Target: ESP32-C3 Super Mini

[env:esp32-c3-devkitc-02]
; Pinned to 6.5.0 (Arduino core 2.0.14) - TFT_eSPI@2.5.43's ESP32-C3 SPI
; register macros (_spi_user etc.) crash on the newer 7.x/core-4.x combo
; (confirmed on hardware: Store access fault in begin_tft_write()). This
; display genuinely is a 1.3" ST7789VW 240x240 SPI panel (confirmed from
; the module's printed spec sheet) - the OLED/I2C detour was based on a
; wrong claim in docs/Reference Guide and has been reverted.
platform = espressif32@6.5.0
board = esp32-c3-devkitc-02
framework = arduino

; Serial monitor
monitor_speed = 115200
upload_speed = 921600

; Libraries
; HX711 driven by our own bit-bang implementation (src/hx711.cpp), no external ADC lib needed.
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ESP32-C3 has native USB, not a UART-to-USB bridge - without this,
    ; Serial.print() goes to UART0 (GPIO20/21) instead of the USB port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI setup via build flags (avoids editing the library's User_Setup.h)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=10
    -DTFT_SCLK=8
    -DTFT_CS=-1        ; module has no CS pin - tied to GND internally
    -DTFT_DC=21
    -DTFT_RST=-1
    -DSPI_FREQUENCY=27000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
